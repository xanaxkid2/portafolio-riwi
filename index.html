<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="header">

        <nav class="navbar">
            <div class="logo">
                PORTAFOLIO RIWI .
            </div>

            <div class="nav-right">
                <div class="links">
                    <a href="#">Inteligencia artificial</a>
                    <a href="#">Algoritmos</a>
                </div>

                <button class="btn-nav">Rueda Libre</button>
            </div>
        </nav>

    </header>

    <section class="promo-carousel">

        <button class="promo-arrow" id="promo-prev">
            &#10094;
        </button>

        <div class="promo-content">

            <div class="promo-slide active">
                <span class="promo-tag">
                    <i class="fa-solid fa-globe"></i>
                </span>
                <p>Bienvenido a mi portafolio personal</p>
                <span class="promo-detail">2026</span>
            </div>

            <div class="promo-slide">
                <span class="promo-tag">PROYECTOS</span>
                <p>Descubre mis proyectos de desarrollo web</p>
                <span class="promo-detail">EXPLORAR ↗</span>
            </div>

            <div class="promo-slide">
                <span class="promo-tag">TECNOLOGÍA</span>
                <p>Ideas, código y creatividad en un solo lugar</p>
                <span class="promo-detail">PORTAFOLIO</span>
            </div>

        </div>

        <button class="promo-arrow" id="promo-next">
            &#10095;
        </button>

    </section>

    <main>

        <section class="hero">
            <div class="hero-text">
                <h1>
                    FELIPE<br>
                    ROJAS VALVERDE
                </h1>

                <p>DESARROLLADOR DE SOFTWARE</p>
                <p class="clan">clan ubuntu</p>

            </div>

            <div class="hero-image-wrapper">

               
                <div class="hero-image">
                    <img src="/.png" alt="foto de perfil">
                </div>

                
                <img src="assets/heroe.jpg" alt="" class="hero-decoration">

            </div>

        </section>


        <section>
            <div class="content">
                <div class="card">
                    
                </div>

            </div>



        </section>


    </main>






</body>

</html>
